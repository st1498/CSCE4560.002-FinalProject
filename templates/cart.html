<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cart - Safelock Security</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <a href="{{ url_for('index') }}" class="logo">Safelock Security</a>
        <nav>
            <span>{{ session.get('username', 'Guest') }}</span> |
            <a href="{{ url_for('index') }}">Home</a> |
            <a href="{{ url_for('signin') }}">Logout</a>
        </nav>
    </header>

    <div class="breadcrumb">
        <a href="{{ url_for('index') }}">Home</a> > <strong>Shopping Cart</strong>
    </div>

    <div class="container">
        <h2>Your Shopping Cart</h2>
        <table>
            <thead>
                <tr>
                    <th>Product ID</th>
                    <th>Item Information</th>
                    <th>Total Price</th>
                </tr>
            </thead>
            <tbody id="cart-display"></tbody>
        </table>

        <div class="button-row">
            <a href="{{ url_for('checkout') }}" class="btn">Proceed to Checkout</a>
        </div>
    </div>

    <script>
        const productName = localStorage.getItem('cartItemName');
        const productPrice = localStorage.getItem('cartItemPrice');
        const displayArea = document.getElementById('cart-display');

        if (productName && productPrice) {
            displayArea.innerHTML = `
                <tr>
                    <td>#SEC-${Math.floor(Math.random() * 1000)}</td>
                    <td>CyberMax ${productName}</td>
                    <td>${productPrice}</td>
                </tr>
            `;
        } else {
            displayArea.innerHTML = `
                <tr>
                    <td colspan="3" style="text-align: center; padding: 40px;">
                        Your cart is empty.
                        <a href="{{ url_for('index') }}" style="color: #990100; font-weight: bold; text-decoration: none;">Go back to shop.</a>
                    </td>
                </tr>
            `;
        }

        function handleLogout() {
            localStorage.clear();
            window.location.href = "{{ url_for('signin') }}";
        }
    </script>
</body>
</html>
