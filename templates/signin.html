<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign In - Safelock Security</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="box">

      
        <a href="{{ url_for('index') }}" class="logo">Safelock Security</a>

      
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }}" style="color: #990100; font-size: 14px; margin-bottom: 10px;">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

       
        <div class="auth-message" style="text-align: center; margin-bottom: 20px;">
            <p>Sign in with your Google account to continue.</p>
        </div>

        <div class="google-auth-container">
            <a href="{{ url_for('google_login') }}" class="btn-google">
                <img src="{{ url_for('static', filename='google-logo.svg') }}" alt="Google Logo" class="google-icon">
                <span>Sign in with Google</span>
            </a>
        </div>
        
        <div class="links" style="margin-top: 20px; text-align: center;">
            Don't have an account?
            <a href="{{ url_for('signup') }}" style="color: #990100; font-weight: bold; text-decoration: none;">
                Sign Up
            </a>
        </div>

    </div>
</body>
</html>
