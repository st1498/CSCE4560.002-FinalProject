<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up - Safelock Security</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="box">
        <a href="{{ url_for('index') }}" class="logo">Safelock Security</a>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }}" style="color: #990100; font-size: 13px; margin-bottom: 10px; text-align: center;">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <div class="auth-message" style="text-align: center; margin-bottom: 20px;">
            <p>Create your account using Google OAuth.</p>
        </div>

        <div class="google-auth-container">
            <a href="{{ url_for('google_login') }}" class="btn-google" style="text-decoration: none; display: flex; align-items: center; justify-content: center;">
                <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="Google Logo" class="google-icon" style="width: 18px; margin-right: 10px;">
                Continue with Google
            </a>
        </div>

        <div class="login-link" style="margin-top: 20px; text-align: center; font-size: 14px;">
            Already have an account? <a href="{{ url_for('signin') }}" style="color: #990100; font-weight: bold; text-decoration: none;">Sign In</a>
        </div>
    </div>
</body>
</html>
