<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Change Password - Safelock Security</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
    </style>
</head>
<body>
    <header>
        <a href="{{ url_for('index') }}" class="logo">Safelock Security</a>
        <nav>
            <span id="display-user">{{ session.get('username', 'Guest') }}</span> |
            <a href="{{ url_for('index') }}">Home</a> |
            <a href="{{ url_for('profile', user_id=session.get('user_id')) }}">Profile</a> |
            <a href="{{ url_for('signin') }}">Logout</a>
        </nav>
    </header>
    <div class="breadcrumb">
        <a href="{{ url_for('index') }}">Home</a> >
        <a href="{{ url_for('profile', user_id=session.get('user_id')) }}">Profile</a> >
        <strong>Change Password</strong>
    </div>
    
    <div class="container">
        <h2>Secure Password Reset</h2>
        <p style="font-size: 14px; color: #333;">Enter your current password to verify your identity.</p>

        <form action="{{ url_for('change_password') }}" method="POST">
            <input type="password" id="current-pass" name="current-pass" placeholder="Current Password" required>
            <hr style="border: 0; border-top: 1px solid #E8E8E8; margin: 20px 0;">
            <input type="password" id="new-pass" name="new-pass" placeholder="New Password" required>
            <p class="rules">Must be 12+ characters with Upper, Lower, Number, and Special characters.</p>
            <input type="password" id="confirm-new-pass" name="confirm-new-pass" placeholder="Confirm New Password" required>
            <button type="submit" class="btn">Update Password</button>
        </form>

        <a href="{{ url_for('profile', user_id=session.get('user_id')) }}" class="cancel-link">Cancel and Go Back</a>
    </div>
</body>
</html>
