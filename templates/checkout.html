<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Checkout - Safelock Security</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <a href="{{ url_for('index') }}" class="logo">Safelock Security</a>
        <nav>
            <span>{{ session.get('username', 'User') }}</span> |
            <a href="{{ url_for('index') }}">Home</a> |
            <a href="{{ url_for('signin') }}">Logout</a>
        </nav>
    </header>

    <div class="breadcrumb">
        <a href="{{ url_for('index') }}">Home</a> >
        <a href="{{ url_for('cart') }}">Cart</a> >
        <strong>Checkout</strong>
    </div>

    <div class="container">
        <h2>Checkout Information</h2>

        <h3>Personal Details</h3>
        <div class="flex">
            <input type="text" id="fname" placeholder="First Name">
            <input type="text" id="lname" placeholder="Last Name">
        </div>

        <h3>Billing Address</h3>
        <input type="text" id="street" placeholder="Street Address">
        <div class="flex">
            <input type="text" id="city" placeholder="City">
            <input type="text" id="state" placeholder="State">
            <input type="text" id="zip" placeholder="Zip Code">
        </div>

        <h3>Payment Method</h3>
        <p style="font-size: 0.8em; color: #666;">(Demonstration Only)</p>
        <input type="text" placeholder="Credit Card Number">
        <div class="flex">
            <input type="text" placeholder="MM/YY" style="flex: 2;">
            <input type="text" placeholder="CVV" style="flex: 1;">
        </div>

        <button class="btn" onclick="processPayment()">Process Payment</button>
    </div>

   <script>
        function processPayment() {
            const street = document.getElementById('street').value;
            const city = document.getElementById('city').value;
            const state = document.getElementById('state').value;
            const zip = document.getElementById('zip').value;

            if (street && city && state && zip) {
                const fullAddress = `${street}, ${city}, ${state} ${zip}`;
                localStorage.setItem('userAddress', fullAddress);

                // FIX 3: Point to a confirmation route
                // Make sure you have @app.route('/confirmation') in your app.py!
                window.location.href = "{{ url_for('index') }}";
                alert("Payment Processed! Redirecting to Home.");
            } else {
                alert("Please complete the billing address to secure your order.");
            }
        }
</script>
</body>
</html>
