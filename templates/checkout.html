    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Checkout - Safelock Security</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <a href="{{ url_for('index') }}" class="logo">Safelock Security</a>
        <nav>
            <span>{{ session.get('username', 'User') }}</span> |
            <a href="{{ url_for('index') }}">Home</a> |
            <a href="{{ url_for('signin') }}">Logout</a>
        </nav>
    </header>

    <div class="breadcrumb">
        <a href="{{ url_for('index') }}">Home</a> >
        <a href="{{ url_for('cart') }}">Cart</a> >
        <strong>Checkout</strong>
    </div>

    <div class="container">
        <h2>Checkout Information</h2>

        <h3>Personal Details</h3>
        <div class="flex">
            <input type="text" id="fname" placeholder="First Name">
            <input type="text" id="lname" placeholder="Last Name">
        </div>

        <h3>Billing Address</h3>
        <input type="text" id="street" placeholder="Street Address">
        <div class="flex">
            <input type="text" id="city" placeholder="City">
            <input type="text" id="state" placeholder="State">
            <input type="text" id="zip" placeholder="Zip Code">
        </div>

        <h3>Pay with PayPal</h3>
        <div id="paypal-button-container"></div>
    </div>

    <!-- PayPal JS SDK -->
    <script src="https://www.sandbox.paypal.com/sdk/js?client-id={{ paypal_client_id }}&currency=USD"></script>

<script>
paypal.Buttons({

    createOrder: function(data, actions) {
        // Set product BEFORE creating order
        return fetch("/api/set-product", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                product_id: 1
            })
        })
        .then(() => {
            return fetch("/api/paypal/create-order", {
                method: "POST"
            });
        })
        .then(res => res.text())
        .then(text => {
            console.log("RAW RESPONSE:", text);

            try {
                const data = JSON.parse(text);
                return data.id;
            } catch (e) {
                throw new Error("Server did not return JSON");
            }
        });
    },

    onApprove: function(data, actions) {
        // Capture order WITH orderID in URL
        return fetch(`/api/paypal/capture-order/${data.orderID}`, {
            method: "POST"
        })
        .then(res => res.json())
        .then(details => {

            // Save address locally
            const street = document.getElementById('street').value;
            const city = document.getElementById('city').value;
            const state = document.getElementById('state').value;
            const zip = document.getElementById('zip').value;

            if (street && city && state && zip) {
                const fullAddress = `${street}, ${city}, ${state} ${zip}`;
                localStorage.setItem('userAddress', fullAddress);
            }

            alert("Payment successful!");
            window.location.href = "{{ url_for('index') }}";
        });
    },

    onError: function(err) {
        console.error(err);
        alert("Payment failed. Please try again.");
    }

}).render('#paypal-button-container');
</script>
